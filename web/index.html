<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skill Pet</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="collapsed">
    <main class="shell">
      <section class="mast">
        <div>
          <p class="eyebrow">Local Codex Skills</p>
          <h1>Skill Pet</h1>
        </div>
        <div class="stats" id="stats"></div>
      </section>
      <section class="toolbar">
        <input id="search" type="search" placeholder="搜索 skill 名称、功能或插件">
      </section>
      <section class="layout">
        <aside class="list" id="list"></aside>
      </section>
    </main>
    <button class="pet" id="pet" type="button" aria-label="Toggle Skill Pet">
      <span class="pet-face">SP</span>
    </button>
    <script type="module" src="/main.js"></script>
  </body>
</html>
