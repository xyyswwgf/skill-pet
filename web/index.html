<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skill Pet</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="collapsed">
    <main class="shell">
      <div class="content">
        <section class="mast">
          <h1>已添加的 Skills</h1>
          <div class="header-actions">
            <div class="stats" id="stats"></div>
            <button class="refresh" id="refresh" type="button">刷新</button>
          </div>
          <p class="status" id="status" aria-live="polite"></p>
        </section>
        <section class="toolbar">
          <input id="search" type="search" placeholder="搜索名称、用途或插件">
        </section>
        <section class="layout">
          <aside class="list" id="list"></aside>
        </section>
      </div>
    </main>
    <button class="pet" id="pet" type="button" aria-label="展开或收起 Skill Pet">
      <img class="pet-mark" src="/skill-pet-icon.png" alt="">
    </button>
    <script type="module" src="/main.js"></script>
  </body>
</html>
